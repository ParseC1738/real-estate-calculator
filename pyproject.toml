[project]
name = "immo-rendite"
version = "0.1.0"
description = "Local web app that collects real-estate listings and calculates investment metrics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "plotly>=5.20",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff would also reformat Python code blocks inside Markdown; the docs stay as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W: style, F: pyflakes, I: import sorting, UP: modern syntax, B: likely bugs, SIM: simplifications
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
